model_name: "gpt2"
reward_model_name: "OpenAssistant/reward-model-deberta-v3-large-v2"
output_dir: ".research/iteration3/"
max_samples: 50

datasets:
  ultrafeedback: "HuggingFaceH4/ultrafeedback_binarized"

noise_levels: [0, 40] # Test clean and one noisy condition
seeds: [42]

training_args:
  output_dir: ".research/iteration3/smoke_test_checkpoints/"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  dataloader_pin_memory: false
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 2
  optim: "adamw_torch"
  fp16: true
  logging_steps: 1
  save_steps: 5
  eval_steps: 5
  eval_strategy: "steps"
  do_eval: true
  report_to: "none"

lora_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

r2d2po_params:
  beta: 0.1
  alpha: 0.4
  gamma: 1.28
  ensemble_size: 2

evaluation:
  mt_bench_dataset: "HuggingFaceH4/mt_bench_prompts"
