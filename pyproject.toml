[project]
name = "r2-d2po-research"
version = "0.1.0"
description = "Implementation of R2-D2PO for robust preference tuning."
authors = [{name = "ML Researcher"}]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
    "trl>=0.8.6",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "wandb>=0.16.0",
    "fvcore>=0.1.6",
    "psutil>=5.9.0"
]

[tool.setuptools]
packages = ["src"]
